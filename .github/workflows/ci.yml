name: CI

# - PRs / push a main|develop → test + build (sin publicar imágenes)
# - push a main → además publica imágenes a GHCR
# Esta restricción es intencional: las imágenes de release sólo se generan
# cuando el código llega a main, así no llenamos el registry con builds intermedios.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test backend + frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Backend tests (Jest + Supertest)
        run: npm run test:back

      - name: Frontend tests (Vitest)
        run: npm run test:front

      - name: Frontend build
        run: npm run build

  publish-images:
    name: Build & publish Docker images to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner (GHCR exige lowercase)
        id: repo
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_lc }}/ifx-vm-backend:latest
            ghcr.io/${{ steps.repo.outputs.owner_lc }}/ifx-vm-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_lc }}/ifx-vm-frontend:latest
            ghcr.io/${{ steps.repo.outputs.owner_lc }}/ifx-vm-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
