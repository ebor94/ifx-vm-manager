# Configuración nginx para servir el SPA del frontend.
# Se monta en /etc/nginx/conf.d/default.conf desde el Dockerfile.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión para responder más liviano (HTML/JS/CSS).
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Assets versionados por hash → cachear un año, immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: cualquier path que no matchee un archivo real
  # devuelve index.html, así Vue Router resuelve la ruta del lado cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Endpoint de healthcheck (usado por docker compose).
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
